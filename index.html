<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FORTNITE STORE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
            --balance-bg: #2dd4bf;
            --border-color: #334155;
            --rub-color: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, var(--bg-color));
            color: var(--tg-theme-text-color, var(--text-color));
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding-bottom: 70px;
            box-sizing: border-box;
        }
        
        .header {
            background: var(--card-bg);
            padding: 15px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .store-name {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-color);
            margin: 0;
        }
        .lang-switch {
            display: flex;
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .lang-btn {
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .lang-btn.active {
            background: var(--accent-color);
            color: white;
        }
        
        .timer-bar {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            padding: 10px 0;
            background: rgba(255,255,255,0.05);
            margin: 10px 15px;
            border-radius: 8px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 15px;
            margin-top: 10px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }
        .item-image {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #3b82f6, var(--accent-color));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .item-image img {
            width: 100%; 
            height: 100%; 
            object-fit: contain;
        }
        .item-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .item-name {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .item-price-v {
            font-size: 12px;
            color: var(--balance-bg);
            font-weight: bold;
        }
        .item-price-rub {
            font-size: 11px;
            color: var(--rub-color);
        }
        .buy-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 6px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
            margin-top: 5px;
        }
        .buy-btn:active {
            background: var(--accent-hover);
            transform: scale(0.98);
        }

        /* --- СТИЛИ ДЛЯ КОРЗИНЫ И ПРОФИЛЯ --- */
        .page-view {
            display: none; /* По умолчанию скрыты */
            padding: 15px;
            flex-direction: column;
        }
        .page-view.active {
            display: flex;
        }
        .page-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--accent-color);
        }
        .empty-message {
            text-align: center;
            color: #64748b;
            margin-top: 50px;
            font-size: 16px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }
        .nav-item {
            font-size: 24px;
            color: #64748b;
            cursor: pointer;
            padding: 10px;
            transition: 0.2s;
        }
        .nav-item.active {
            color: var(--accent-color);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="store-name">FORTNITE STORE</h1>
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLang('ru')">RU</button>
            <button class="lang-btn" onclick="setLang('en')">EN</button>
        </div>
    </div>

    <div class="timer-bar" id="timer-text">Загрузка...</div>

    <!-- СТРАНИЦА 1: МАГАЗИН -->
    <div id="view-shop" class="page-view active">
        <div class="shop-grid" id="shop-container">
            <div class="empty-message" style="grid-column: span 2;">Загрузка скинов...</div>
        </div>
    </div>

    <!-- СТРАНИЦА 2: КОРЗИНА -->
    <div id="view-cart" class="page-view">
        <div class="page-title">Ваши покупки</div>
        <div id="cart-container"></div>
    </div>

    <!-- СТРАНИЦА 3: ПРОФИЛЬ -->
    <div id="view-profile" class="page-view">
        <div class="page-title">Профиль</div>
        <div class="cart-item">
            <span>Ваш баланс:</span>
            <strong id="profile-balance">0 V-Bucks</strong>
        </div>
        <div class="cart-item">
            <span>Статус:</span>
            <strong style="color: var(--balance-bg);">VIP Игрок</strong>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('shop')">🏠</div>
        <div class="nav-item" onclick="switchTab('cart')">🛒</div>
        <div class="nav-item" onclick="switchTab('profile')">👤</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const translations = {
            ru: { timerPrefix: "Обновление магазина через: ", buyBtn: "Купить", success: "Успешно куплено!" },
            en: { timerPrefix: "Shop updates in: ", buyBtn: "Buy", success: "Successfully purchased!" }
        };

        let currentLang = 'ru';
        let userBalance = parseInt(localStorage.getItem('vbucks')) || 1200;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // ==========================================
        // ⚙️ НАСТРОЙКИ (МОЖНО МЕНЯТЬ ЗДЕСЬ)
        // ==========================================
        // Количество товаров, которые нужно загрузить из API
        const ITEMS_TO_LOAD = 20; 
        
        // Мы задаем цены по кругу (если товаров больше, чем цен, они повторяются)
        const priceList = [
            { priceV: 800, priceRub: 780 },  // Цена для 1-го товара
            { priceV: 500, priceRub: 490 },  // Цена для 2-го
            { priceV: 200, priceRub: 190 },  // Цена для 3-го
            { priceV: 1200, priceRub: 1100 },// Цена для 4-го
            { priceV: 400, priceRub: 380 },  // Цена для 5-го
            { priceV: 900, priceRub: 850 },  // Цена для 6-го
            { priceV: 1500, priceRub: 1400 },// Цена для 7-го (БУДЕТ СКРЫТ)
            { priceV: 100, priceRub: 90 }    // Цена для 8-го
        ];

        // --- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ---
        function switchTab(tabName) {
            // Скрываем все страницы
            document.querySelectorAll('.page-view').forEach(page => page.classList.remove('active'));
            // Убираем активный класс со всех иконок
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));

            // Показываем нужную
            document.getElementById('view-' + tabName).classList.add('active');
            
            // Подсвечиваем нужную иконку (находим ее по порядку)
            if (tabName === 'shop') document.querySelectorAll('.nav-item')[0].classList.add('active');
            if (tabName === 'cart') {
                document.querySelectorAll('.nav-item')[1].classList.add('active');
                renderCart(); // Обновляем корзину при открытии
            }
            if (tabName === 'profile') {
                document.querySelectorAll('.nav-item')[2].classList.add('active');
                document.getElementById('profile-balance').innerText = userBalance + ' V-Bucks'; // Обновляем баланс
            }
        }

        // --- ЗАГРУЗКА ДАННЫХ ИЗ API ---
        async function fetchFortniteSkins() {
            try {
                const response = await fetch('https://fortnite-api.com/v2/cosmetics/br');
                const data = await response.json();
                
                const container = document.getElementById('shop-container');
                container.innerHTML = '';

                const skins = data.data.slice(0, ITEMS_TO_LOAD);
                let displayCount = 0;

                skins.forEach((skin, index) => {
                    // Берем цену по кругу (если товаров больше, чем цен)
                    const price = priceList[index % priceList.length];

                    // ФИЛЬТР: Если цена больше 1200, мы ПРОПУСКАЕМ этот товар
                    if (price.priceV > 1200) return;

                    const card = document.createElement('div');
                    card.className = 'item-card';
                    const imageUrl = skin.images.icon;
                    const skinName = skin.name;
                    const buyText = translations[currentLang].buyBtn;

                    card.innerHTML = `
                        <div class="item-image"><img src="${imageUrl}" alt="${skinName}"></div>
                        <div class="item-details">
                            <div>
                                <div class="item-name">${skinName}</div>
                                <div class="item-price-row">
                                    <span class="item-price-v">${price.priceV} V-Bucks</span>
                                    <span class="item-price-rub">~ ${price.priceRub} ₽</span>
                                </div>
                            </div>
                            <button class="buy-btn" onclick="buyItem('${skinName}', ${price.priceV}, '${imageUrl}')">${buyText}</button>
                        </div>
                    `;
                    container.appendChild(card);
                    displayCount++;
                });

                if(displayCount === 0) {
                    container.innerHTML = '<div class="empty-message" style="grid-column: span 2;">Нет товаров до 1200 V-Bucks</div>';
                }

            } catch (error) {
                document.getElementById('shop-container').innerHTML = '<div class="empty-message" style="grid-column: span 2;">Ошибка загрузки</div>';
            }
        }

        // --- ПОКУПКА ---
        function buyItem(name, price, image) {
            if (userBalance >= price) {
                userBalance -= price;
                localStorage.setItem('vbucks', userBalance);
                
                // Добавляем в корзину
                cart.push({ name: name, price: price, image: image });
                localStorage.setItem('cart', JSON.stringify(cart));

                tg.showPopup({
                    title: '✔️',
                    message: translations[currentLang].success,
                    buttons: [{type: 'ok'}]
                });
                tg.sendData(`Куплен: ${name}`);
            } else {
                tg.showAlert("Недостаточно вбаксов!");
            }
        }

        // --- ОТРИСОВКА КОРЗИНЫ ---
        function renderCart() {
            const container = document.getElementById('cart-container');
            container.innerHTML = '';
            
            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-message">У вас пока нет покупок</div>';
                return;
            }

            cart.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <span>${item.name}</span>
                    <strong style="color: var(--balance-bg);">${item.price} V</strong>
                `;
                container.appendChild(div);
            });
        }

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateTimer(); 
        }

        function updateTimer() {
            const now = new Date();
            let target = new Date();
            target.setHours(3, 0, 0, 0); 
            if (now > target) target.setDate(target.getDate() + 1);

            const diff = target - now;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('timer-text').innerText = 
                `${translations[currentLang].timerPrefix}${hours}ч ${minutes}м ${seconds}с`;
        }

        // ЗАПУСК
        fetchFortniteSkins();
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
