<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FORTNITE STORE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
            --balance-bg: #2dd4bf;
            --balance-text: #0f172a;
            --border-color: #334155;
            --rub-color: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, var(--bg-color));
            color: var(--tg-theme-text-color, var(--text-color));
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding-bottom: 70px;
            box-sizing: border-box;
        }
        
        .header {
            background: var(--card-bg);
            padding: 15px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .store-name {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-color);
            margin: 0;
        }
        /* Кнопка языка */
        .lang-switch {
            display: flex;
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .lang-btn {
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .lang-btn.active {
            background: var(--accent-color);
            color: white;
        }
        
        .timer-bar {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            padding: 10px 0;
            background: rgba(255,255,255,0.05);
            margin: 10px 15px;
            border-radius: 8px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 15px;
            margin-top: 10px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }
        .item-image {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #3b82f6, var(--accent-color));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .item-image img {
            width: 100%; 
            height: 100%; 
            object-fit: contain;
        }
        .item-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .item-name {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .item-price-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 8px;
        }
        .item-price-v {
            font-size: 12px;
            color: var(--balance-bg);
            font-weight: bold;
        }
        .item-price-rub {
            font-size: 11px;
            color: var(--rub-color);
        }
        .buy-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 6px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
            transition: 0.2s;
        }
        .buy-btn:active {
            background: var(--accent-hover);
            transform: scale(0.98);
        }
        
        .loader {
            text-align: center;
            color: #94a3b8;
            grid-column: span 2;
            padding: 40px 0;
            font-size: 14px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }
        .nav-item {
            font-size: 24px;
            color: #64748b;
            cursor: pointer;
            padding: 10px;
        }
        .nav-item.active {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="store-name" id="ui-store-name">FORTNITE STORE</h1>
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLang('ru')">RU</button>
            <button class="lang-btn" onclick="setLang('en')">EN</button>
        </div>
    </div>

    <div class="timer-bar" id="timer-text">Загрузка...</div>

    <div class="shop-grid" id="shop-container">
        <div class="loader">Загрузка скинов...</div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">🏠</div>
        <div class="nav-item">🛒</div>
        <div class="nav-item">👤</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const translations = {
            ru: { timerPrefix: "Обновление магазина через: ", buyBtn: "Купить", success: "Успешно куплено!" },
            en: { timerPrefix: "Shop updates in: ", buyBtn: "Buy", success: "Successfully purchased!" }
        };

        let currentLang = 'ru';
        let userBalance = 1200; // Баланс просто для логики покупки

        // ==========================================
        // ⚙️ НАСТРОЙКИ ЦЕН (ТЫ МЕНЯЕШЬ ЗДЕСЬ)
        // ==========================================
        // Так как API не всегда отдает цены в V-Bucks, мы задаем их сами.
        // Картинки и названия будут браться из API.
        const priceSettings = [
            { priceV: 800, priceRub: 780 },
            { priceV: 500, priceRub: 490 },
            { priceV: 200, priceRub: 190 },
            { priceV: 100, priceRub: 90 },
            { priceV: 1200, priceRub: 1100 },
            { priceV: 400, priceRub: 380 },
            { priceV: 900, priceRub: 850 }
        ];

        // --- ЗАГРУЗКА ДАННЫХ ИЗ FORTNITE-API ---
        async function fetchFortniteSkins() {
            try {
                // Запрашиваем список косметики (скины)
                const response = await fetch('https://fortnite-api.com/v2/cosmetics/br');
                const data = await response.json();
                
                const container = document.getElementById('shop-container');
                container.innerHTML = '';

                // Берем первые 7 скинов из ответа API
                const skins = data.data.slice(0, 7);

                skins.forEach((skin, index) => {
                    // Если для этого слота нет настроек цены, пропускаем
                    if (!priceSettings[index]) return;

                    const card = document.createElement('div');
                    card.className = 'item-card';
                    
                    // Берем картинку и имя из API
                    const imageUrl = skin.images.icon;
                    const skinName = skin.name;
                    
                    const price = priceSettings[index];
                    const buyText = translations[currentLang].buyBtn;

                    card.innerHTML = `
                        <div class="item-image">
                            <img src="${imageUrl}" alt="${skinName}">
                        </div>
                        <div class="item-details">
                            <div>
                                <div class="item-name">${skinName}</div>
                                <div class="item-price-row">
                                    <span class="item-price-v">${price.priceV} V-Bucks</span>
                                    <span class="item-price-rub">~ ${price.priceRub} ₽</span>
                                </div>
                            </div>
                            <button class="buy-btn" onclick="buyItem('${skinName}', ${price.priceV})">${buyText}</button>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Ошибка API:", error);
                document.getElementById('shop-container').innerHTML = '<div class="loader">Не удалось загрузить магазин. Попробуйте позже.</div>';
            }
        }

        // --- СМЕНА ЯЗЫКА ---
        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Названия скинов из API часто только на английском, 
            // но кнопки и таймер переведутся.
            updateTimer(); 
        }

        // --- ПОКУПКА ---
        function buyItem(name, price) {
            if (userBalance >= price) {
                userBalance -= price;
                tg.showPopup({
                    title: '✔️',
                    message: translations[currentLang].success,
                    buttons: [{type: 'ok'}]
                });
                tg.sendData(`Куплен: ${name}`);
            } else {
                tg.showAlert(translations[currentLang].noMoney);
            }
        }

        // --- ТАЙМЕР ---
        function updateTimer() {
            const now = new Date();
            let target = new Date();
            target.setHours(3, 0, 0, 0); 

            if (now > target) {
                target.setDate(target.getDate() + 1);
            }

            const diff = target - now;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const prefix = translations[currentLang].timerPrefix;
            document.getElementById('timer-text').innerText = 
                `${prefix}${hours}ч ${minutes}м ${seconds}с`;
        }

        // ЗАПУСК
        fetchFortniteSkins(); // Загружаем скины из API
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
