<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FORTNITE STORE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
            --border-color: #334155;
            --rub-color: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, var(--bg-color));
            color: var(--tg-theme-text-color, var(--text-color));
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding-bottom: 70px;
            box-sizing: border-box;
        }
        
        /* --- ШАПКА --- */
        .header {
            background: var(--card-bg);
            padding: 15px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .store-name {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-color);
            margin: 0;
        }
        
        /* --- ЭКРАН 1: ГЛАВНОЕ МЕНЮ --- */
        .main-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
        }
        .menu-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .menu-card:active {
            transform: scale(0.97);
        }
        .menu-card h2 {
            margin: 0;
            font-size: 22px;
            color: var(--text-color);
        }
        .menu-card p {
            margin: 5px 0 0 0;
            color: #94a3b8;
            font-size: 13px;
        }

        /* --- ЭКРАН 2: РАЗДЕЛ FORTNITE --- */
        .sub-tabs {
            display: flex;
            gap: 10px;
            padding: 15px;
            justify-content: center;
        }
        .sub-tab {
            background: var(--card-bg);
            color: #94a3b8;
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .sub-tab.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* --- СЕТКА ТОВАРОВ --- */
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 15px;
        }
        .item-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .item-card:active {
            transform: scale(0.97);
        }
        .item-image {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #3b82f6, var(--accent-color));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .item-image img {
            width: 100%; 
            height: 100%; 
            object-fit: contain;
        }
        .item-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .item-name {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .item-price-v {
            font-size: 12px;
            color: #2dd4bf;
            font-weight: bold;
        }
        .item-price-rub {
            font-size: 11px;
            color: var(--rub-color);
        }

        /* --- МОДАЛЬНОЕ ОКНО --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .modal-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .modal-price {
            font-size: 18px;
            color: #2dd4bf;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-buy {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-buy:active { background: var(--accent-hover); }
        .btn-close {
            background: transparent;
            color: #94a3b8;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- УПРАВЛЕНИЕ ЭКРАНАМИ --- */
        .screen {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
        }
        .screen.active {
            display: flex;
        }

        /* --- ПРОЧЕЕ --- */
        .empty-message {
            text-align: center;
            color: #64748b;
            margin-top: 50px;
            font-size: 16px;
            grid-column: span 2;
        }

        /* --- НИЖНЕЕ МЕНЮ --- */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }
        .nav-item {
            font-size: 24px;
            color: #64748b;
            cursor: pointer;
            padding: 10px;
            transition: 0.2s;
        }
        .nav-item.active {
            color: var(--accent-color);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="store-name" id="header-title">FORTNITE STORE</h1>
        <button class="btn-close" style="padding: 5px 15px; font-size: 12px;" onclick="goBack()" id="back-btn">Назад</button>
    </div>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="screen-home" class="screen active">
        <div class="main-menu">
            <div class="menu-card" onclick="openSection('fortnite')">
                <h2>Fortnite</h2>
                <p>Скины, кирки, танцы</p>
            </div>
            <div class="menu-card" onclick="openSection('other')">
                <h2>Прочее</h2>
                <p>Различные услуги и предметы</p>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: РАЗДЕЛ FORTNITE -->
    <div id="screen-fortnite" class="screen">
        <!-- Подкатегории -->
        <div class="sub-tabs">
            <button class="sub-tab active" onclick="switchSubTab('skins')" id="tab-skins">Скины</button>
            <button class="sub-tab" onclick="switchSubTab('other_ft')" id="tab-other_ft">Прочее</button>
        </div>

        <!-- Товары: Скины -->
        <div id="grid-skins" class="shop-grid">
            <!-- Заполняется через JS -->
        </div>

        <!-- Товары: Прочее в Фортрайт -->
        <div id="grid-other_ft" class="shop-grid" style="display: none;">
            <div class="empty-message">Тут скоро появятся кирки и танцы</div>
        </div>
    </div>

    <!-- ЭКРАН 3: ПРОЧЕЕ (Глобальное) -->
    <div id="screen-other" class="screen">
        <div style="padding: 20px; text-align: center; color: #94a3b8;">
            <h2>Раздел в разработке</h2>
            <p>Здесь будут другие товары и услуги.</p>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div class="modal-overlay" id="itemModal">
        <div class="modal-content">
            <img id="modal-img" class="modal-image" src="" alt="Item">
            <div class="modal-title" id="modal-name"></div>
            <div class="modal-price" id="modal-price"></div>
            
            <div class="modal-buttons">
                <button class="btn-buy" onclick="confirmPurchase()">Купить</button>
                <button class="btn-close" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="goHome()">🏠</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ⚠️ Твой ник в Telegram (без @)
        const TELEGRAM_CONTACT = "niyaz_5518"; 

        let selectedItem = null; 

        // --- СПИСОК СКИНОВ ---
        const storeSkins = [
            { name: "Renegade Raider", priceV: 1200, priceRub: 1140, image: "https://static.wikia.nocookie.net/fortnite/images/5/5b/Renegade_Raider_-_Outfit_-_Fortnite.png" },
            { name: "Aerial Assault Trooper", priceV: 1200, priceRub: 1140, image: "https://static.wikia.nocookie.net/fortnite/images/9/91/Aerial_Assault_Trooper_-_Outfit_-_Fortnite.png" },
            { name: "Raptor", priceV: 1200, priceRub: 1140, image: "https://static.wikia.nocookie.net/fortnite/images/e/e3/Raptor_-_Outfit_-_Fortnite.png" },
            { name: "Red Knight", priceV: 1200, priceRub: 1140, image: "https://static.wikia.nocookie.net/fortnite/images/1/1c/Red_Knight_-_Outfit_-_Fortnite.png" },
            { name: "Black Knight", priceV: 1200, priceRub: 1140, image: "https://static.wikia.nocookie.net/fortnite/images/0/0f/Black_Knight_-_Outfit_-_Fortnite.png" },
            { name: "Drift", priceV: 950, priceRub: 900, image: "https://static.wikia.nocookie.net/fortnite/images/3/3e/Drift_-_Outfit_-_Fortnite.png" },
            { name: "Midas", priceV: 1200, priceRub: 1140, image: "https://static.wikia.nocookie.net/fortnite/images/9/9c/Midas_-_Outfit_-_Fortnite.png" },
            { name: "Peely", priceV: 800, priceRub: 760, image: "https://static.wikia.nocookie.net/fortnite/images/4/48/Peely_-_Outfit_-_Fortnite.png" }
        ];

        // --- НАВИГАЦИЯ ---
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + screenId).classList.add('active');
            
            // Показываем/скрываем кнопку Назад
            document.getElementById('back-btn').style.display = screenId === 'home' ? 'none' : 'block';
        }

        function goHome() {
            showScreen('home');
            document.querySelector('.nav-item').classList.add('active');
            document.getElementById('header-title').innerText = "FORTNITE STORE";
        }

        function openSection(section) {
            if (section === 'fortnite') {
                showScreen('fortnite');
                document.getElementById('header-title').innerText = "Раздел Fortnite";
                renderSkins();
            } else {
                showScreen('other');
                document.getElementById('header-title').innerText = "Прочее";
            }
        }

        function goBack() {
            goHome();
        }

        // --- ПОДКАТЕГОРИИ (Скины / Прочее в Фортрайт) ---
        function switchSubTab(tab) {
            document.getElementById('tab-skins').classList.remove('active');
            document.getElementById('tab-other_ft').classList.remove('active');
            document.getElementById('tab-' + tab).classList.add('active');

            if (tab === 'skins') {
                document.getElementById('grid-skins').style.display = 'grid';
                document.getElementById('grid-other_ft').style.display = 'none';
            } else {
                document.getElementById('grid-skins').style.display = 'none';
                document.getElementById('grid-other_ft').style.display = 'grid';
            }
        }

        // --- ОТРИСОВКА СКИНОВ ---
        function renderSkins() {
            const container = document.getElementById('grid-skins');
            container.innerHTML = '';

            storeSkins.forEach((skin) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.onclick = () => openModal(skin.name, skin.priceV, skin.priceRub, skin.image);

                card.innerHTML = `
                    <div class="item-image"><img src="${skin.image}" alt="${skin.name}"></div>
                    <div class="item-details">
                        <div class="item-name">${skin.name}</div>
                        <div class="item-price-v">${skin.priceV} V-Bucks</div>
                        <div class="item-price-rub">~ ${skin.priceRub} ₽</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- МОДАЛЬНОЕ ОКНО ---
        function openModal(name, price, priceRub, image) {
            selectedItem = { name: name, price: price };
            document.getElementById('modal-img').src = image;
            document.getElementById('modal-name').innerText = name;
            document.getElementById('modal-price').innerText = `${price} V-Bucks (~${priceRub} ₽)`;
            document.getElementById('itemModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('itemModal').classList.remove('active');
            selectedItem = null;
        }

        function confirmPurchase() {
            if (!selectedItem) return;
            closeModal();

            tg.showPopup({
                title: 'Переход в чат',
                message: `Вы выбрали "${selectedItem.name}". Сейчас откроется чат с продавцом.`,
                buttons: [{type: 'ok', text: 'Перейти в чат'}, {type: 'cancel', text: 'Отмена'}]
            }, (buttonId) => {
                if (buttonId === 'ok') {
                    tg.openTelegramLink(`https://t.me/${TELEGRAM_CONTACT}`);
                }
            });
        }

        // Инициализация при запуске
        goHome();
    </script>
</body>
</html>
