<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FORTNITE STORE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
            --border-color: #334155;
            --rub-color: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, var(--bg-color));
            color: var(--tg-theme-text-color, var(--text-color));
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding-bottom: 70px;
            box-sizing: border-box;
        }
        
        .header {
            background: var(--card-bg);
            padding: 15px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .store-name {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-color);
            margin: 0;
        }

        /* --- ГЛАВНЫЙ ЭКРАН С КАТЕГОРИЯМИ --- */
        .main-menu {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .category-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .category-card:active {
            transform: scale(0.97);
        }
        .category-card h2 {
            margin: 0;
            font-size: 22px;
            color: var(--text-color);
        }
        .category-card p {
            margin: 5px 0 0 0;
            color: #94a3b8;
            font-size: 13px;
        }
        
        /* --- СЕТКА ТОВАРОВ --- */
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 15px;
        }
        .item-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .item-card:active {
            transform: scale(0.97);
        }
        .item-image {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #3b82f6, var(--accent-color));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .item-image img {
            width: 100%; 
            height: 100%; 
            object-fit: contain;
        }
        .item-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .item-name {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .item-price-v {
            font-size: 12px;
            color: #2dd4bf;
            font-weight: bold;
        }
        .item-price-rub {
            font-size: 11px;
            color: var(--rub-color);
        }

        /* --- МОДАЛЬНОЕ ОКНО --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .modal-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .modal-price {
            font-size: 18px;
            color: #2dd4bf;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-buy {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-buy:active { background: var(--accent-hover); }
        .btn-close {
            background: transparent;
            color: #94a3b8;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- УПРАВЛЕНИЕ ЭКРАНАМИ --- */
        .screen {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
        }
        .screen.active {
            display: flex;
        }

        .sub-tabs {
            display: flex;
            gap: 10px;
            padding: 15px;
            justify-content: center;
        }
        .sub-tab {
            background: var(--card-bg);
            color: #94a3b8;
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .sub-tab.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
        
        .empty-message {
            text-align: center;
            color: #64748b;
            margin-top: 50px;
            font-size: 16px;
            grid-column: span 2;
        }

        /* --- НИЖНЕЕ МЕНЮ (ТЕПЕРЬ ТОЛЬКО 2 КНОПКИ) --- */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 65px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            cursor: pointer;
            font-size: 12px;
            padding: 5px 10px;
            transition: 0.2s;
            width: 45%; /* Увеличили ширину, так как кнопок стало 2 */
        }
        .nav-icon {
            font-size: 22px;
            margin-bottom: 3px;
        }
        .nav-item.active {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="store-name" id="header-title">FORTNITE STORE</h1>
    </div>

    <!-- ЭКРАН 1: ГЛАВНАЯ (КАТЕГОРИИ) -->
    <div id="screen-home" class="screen active">
        <div class="main-menu">
            <div class="category-card" onclick="openCategory('fortnite')">
                <h2>Fortnite</h2>
                <p>Скины и другие предметы</p>
            </div>
            <!-- Сюда потом можно добавить другие категории -->
        </div>
    </div>

    <!-- ЭКРАН 2: РАЗДЕЛ FORTNITE -->
    <div id="screen-fortnite" class="screen">
        <div class="sub-tabs">
            <button class="sub-tab active" onclick="switchSubTab('skins')" id="tab-skins">Скины</button>
            <button class="sub-tab" onclick="switchSubTab('other')" id="tab-other">Прочее</button>
        </div>
        
        <div id="grid-skins" class="shop-grid"></div>
        <div id="grid-other-ft" class="shop-grid" style="display:none;">
            <div class="empty-message">Здесь скоро появятся кирки и танцы</div>
        </div>
    </div>

    <!-- ЭКРАН 3: ПРОФИЛЬ -->
    <div id="screen-profile" class="screen">
        <div style="padding: 20px; text-align: center;">
            <div style="background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--border-color);">
                <h3 style="margin-top:0; color: var(--accent-color);">FORTNITE STORE</h3>
                <p style="color: #94a3b8;">Добро пожаловать! Выберите скин и нажмите «Купить».</p>
                <a href="https://t.me/niyaz_5518" target="_blank" style="display:inline-block; margin-top:15px; background:var(--accent-color); color:white; text-decoration:none; padding:10px 20px; border-radius:8px; font-weight:bold;">Написать нам</a>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div class="modal-overlay" id="itemModal">
        <div class="modal-content">
            <img id="modal-img" class="modal-image" src="" alt="Item">
            <div class="modal-title" id="modal-name"></div>
            <div class="modal-price" id="modal-price"></div>
            <div class="modal-buttons">
                <button class="btn-buy" onclick="confirmPurchase()">Купить</button>
                <button class="btn-close" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ (ТОЛЬКО 2 КНОПКИ) -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')" id="btn-home">
            <span class="nav-icon">🏠</span> Главная
        </div>
        <div class="nav-item" onclick="switchTab('profile')" id="btn-profile">
            <span class="nav-icon">👤</span> Профиль
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const TELEGRAM_CONTACT = "niyaz_5518"; 
        let selectedItem = null; 

        // --- СКИНЫ (Ссылки на картинки с добавленным параметром ?) ---
        // Параметр "?" в конце ссылки заставляет браузер скачать картинку заново, обходя кэш.
        const storeSkins = [
            { name: "Renegade Raider", priceV: 1200, priceRub: 1140, image: "https://fortnite-api.com/images/cosmetics/br/cid_028_athena_commando_f.png?" },
            { name: "Aerial Assault Trooper", priceV: 1200, priceRub: 1140, image: "https://fortnite-api.com/images/cosmetics/br/cid_029_athena_commando_f.png?" },
            { name: "Raptor", priceV: 1200, priceRub: 1140, image: "https://fortnite-api.com/images/cosmetics/br/cid_030_athena_commando_m.png?" },
            { name: "Red Knight", priceV: 1200, priceRub: 1140, image: "https://fortnite-api.com/images/cosmetics/br/cid_049_athena_commando_f.png?" },
            { name: "Black Knight", priceV: 1200, priceRub: 1140, image: "https://fortnite-api.com/images/cosmetics/br/cid_050_athena_commando_m.png?" },
            { name: "Drift", priceV: 950, priceRub: 900, image: "https://fortnite-api.com/images/cosmetics/br/cid_098_athena_commando_m.png?" },
            { name: "Midas", priceV: 1200, priceRub: 1140, image: "https://fortnite-api.com/images/cosmetics/br/cid_259_athena_commando_m.png?" },
            { name: "Peely", priceV: 800, priceRub: 760, image: "https://fortnite-api.com/images/cosmetics/br/cid_235_athena_commando_m.png?" }
        ];

        // --- НАВИГАЦИЯ ПО НИЖНЕМУ МЕНЮ ---
        function switchTab(tabName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            document.getElementById('screen-' + tabName).classList.add('active');
            document.getElementById('btn-' + tabName).classList.add('active');
            
            if (tabName === 'home') document.getElementById('header-title').innerText = "FORTNITE STORE";
            if (tabName === 'profile') document.getElementById('header-title').innerText = "Информация";
        }

        // --- ОТКРЫТИЕ КАТЕГОРИИ ---
        function openCategory(category) {
            if (category === 'fortnite') {
                // Переключаем экран
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById('screen-fortnite').classList.add('active');
                // Убираем активную кнопку с "Главная", так как мы внутри категории
                document.getElementById('btn-home').classList.remove('active');
                
                document.getElementById('header-title').innerText = "Раздел Fortnite";
                renderSkins();
            }
        }

        function switchSubTab(tab) {
            document.getElementById('tab-skins').classList.remove('active');
            document.getElementById('tab-other').classList.remove('active');
            document.getElementById('tab-' + tab).classList.add('active');

            if (tab === 'skins') {
                document.getElementById('grid-skins').style.display = 'grid';
                document.getElementById('grid-other-ft').style.display = 'none';
            } else {
                document.getElementById('grid-skins').style.display = 'none';
                document.getElementById('grid-other-ft').style.display = 'grid';
            }
        }

        function renderSkins() {
            const gridFt = document.getElementById('grid-skins');
            gridFt.innerHTML = '';

            storeSkins.forEach((skin) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.onclick = () => openModal(skin.name, skin.priceV, skin.priceRub, skin.image);
                card.innerHTML = `
                    <div class="item-image"><img src="${skin.image}" alt="${skin.name}" onerror="this.style.display='none'"></div>
                    <div class="item-details">
                        <div class="item-name">${skin.name}</div>
                        <div class="item-price-v">${skin.priceV} V-Bucks</div>
                        <div class="item-price-rub">~ ${skin.priceRub} ₽</div>
                    </div>
                `;
                gridFt.appendChild(card);
            });
        }

        function openModal(name, price, priceRub, image) {
            selectedItem = { name: name, price: price };
            document.getElementById('modal-img').src = image;
            document.getElementById('modal-img').onerror = function() { this.style.display = 'none'; };
            document.getElementById('modal-name').innerText = name;
            document.getElementById('modal-price').innerText = `${price} V-Bucks (~${priceRub} ₽)`;
            document.getElementById('itemModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('itemModal').classList.remove('active');
            selectedItem = null;
        }

        function confirmPurchase() {
            if (!selectedItem) return;
            closeModal();
            tg.showPopup({
                title: 'Переход в чат',
                message: `Вы выбрали "${selectedItem.name}". Сейчас откроется чат с продавцом.`,
                buttons: [{type: 'ok', text: 'Перейти в чат'}, {type: 'cancel', text: 'Отмена'}]
            }, (buttonId) => {
                if (buttonId === 'ok') {
                    tg.openTelegramLink(`https://t.me/${TELEGRAM_CONTACT}`);
                }
            });
        }
    </script>
</body>
</html>
