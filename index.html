<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FORTNITE STORE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
            --border-color: #334155;
            --rub-color: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, var(--bg-color));
            color: var(--tg-theme-text-color, var(--text-color));
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding-bottom: 70px;
            box-sizing: border-box;
        }
        
        .header {
            background: var(--card-bg);
            padding: 15px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .store-name {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-color);
            margin: 0;
        }
        .lang-switch {
            display: flex;
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .lang-btn {
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .lang-btn.active {
            background: var(--accent-color);
            color: white;
        }
        
        .timer-bar {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            padding: 10px 0;
            background: rgba(255,255,255,0.05);
            margin: 10px 15px;
            border-radius: 8px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 15px;
            margin-top: 10px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .item-card:active {
            transform: scale(0.97);
        }
        .item-image {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #3b82f6, var(--accent-color));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .item-image img {
            width: 100%; 
            height: 100%; 
            object-fit: contain;
        }
        .item-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .item-name {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .item-price-v {
            font-size: 12px;
            color: #2dd4bf;
            font-weight: bold;
        }
        .item-price-rub {
            font-size: 11px;
            color: var(--rub-color);
        }

        /* Модальное окно */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .modal-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .modal-price {
            font-size: 18px;
            color: #2dd4bf;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-buy {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-buy:active {
            background: var(--accent-hover);
        }
        .btn-close {
            background: transparent;
            color: #94a3b8;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .page-view {
            display: none;
            padding: 15px;
            flex-direction: column;
        }
        .page-view.active {
            display: flex;
        }
        .page-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--accent-color);
        }
        .empty-message {
            text-align: center;
            color: #64748b;
            margin-top: 50px;
            font-size: 16px;
            grid-column: span 2;
        }
        
        /* Стили для страницы профиля/инфо */
        .info-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .info-box p {
            margin: 10px 0;
            color: #94a3b8;
            font-size: 14px;
        }
        .contact-btn {
            display: inline-block;
            margin-top: 15px;
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }
        .nav-item {
            font-size: 24px;
            color: #64748b;
            cursor: pointer;
            padding: 10px;
        }
        .nav-item.active {
            color: var(--accent-color);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="store-name">FORTNITE STORE</h1>
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLang('ru')">RU</button>
            <button class="lang-btn" onclick="setLang('en')">EN</button>
        </div>
    </div>

    <div class="timer-bar" id="timer-text">Загрузка...</div>

    <!-- МАГАЗИН -->
    <div id="view-shop" class="page-view active">
        <div class="shop-grid" id="shop-container">
            <div class="empty-message">Загрузка скинов...</div>
        </div>
    </div>

    <!-- ПРОФИЛЬ / ИНФО -->
    <div id="view-profile" class="page-view">
        <div class="page-title">Информация</div>
        <div class="info-box">
            <h3>FORTNITE STORE</h3>
            <p>Добро пожаловать в наш магазин! Мы работаем быстро и надежно.</p>
            <p>Для покупки выберите скин в каталоге и нажмите «Купить».</p>
            <a href="https://t.me/niyaz_5518" target="_blank" class="contact-btn">Написать нам</a>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div class="modal-overlay" id="itemModal">
        <div class="modal-content">
            <img id="modal-img" class="modal-image" src="" alt="Item">
            <div class="modal-title" id="modal-name"></div>
            <div class="modal-price" id="modal-price"></div>
            
            <div class="modal-buttons">
                <button class="btn-buy" id="modal-buy-btn" onclick="confirmPurchase()">Купить</button>
                <button class="btn-close" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- МЕНЮ (Убрали корзину, оставили Магазин и Профиль/Инфо) -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('shop')">🏠</div>
        <div class="nav-item" onclick="switchTab('profile')">👤</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ⚠️ Твой ник в Telegram (без @)
        const TELEGRAM_CONTACT = "niyaz_5518"; 

        const translations = {
            ru: { timerPrefix: "Обновление магазина через: " },
            en: { timerPrefix: "Shop updates in: " }
        };

        let currentLang = 'ru';
        let selectedItem = null; 
        const ITEMS_TO_LOAD = 40;

        function switchTab(tabName) {
            document.querySelectorAll('.page-view').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));

            document.getElementById('view-' + tabName).classList.add('active');
            
            if (tabName === 'shop') document.querySelectorAll('.nav-item')[0].classList.add('active');
            if (tabName === 'profile') document.querySelectorAll('.nav-item')[1].classList.add('active');
        }

        async function fetchFortniteSkins() {
            try {
                const response = await fetch('https://fortnite-api.com/v2/cosmetics/br');
                const data = await response.json();
                
                const container = document.getElementById('shop-container');
                container.innerHTML = '';

                const skins = data.data.slice(0, ITEMS_TO_LOAD);

                skins.forEach((skin) => {
                    const priceV = Math.floor(Math.random() * 12 + 1) * 100; 
                    const priceRub = Math.floor(priceV * 0.95);

                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.onclick = () => openModal(skin.name, priceV, priceRub, skin.images.icon);

                    card.innerHTML = `
                        <div class="item-image"><img src="${skin.images.icon}" alt="${skin.name}"></div>
                        <div class="item-details">
                            <div class="item-name">${skin.name}</div>
                            <div class="item-price-v">${priceV} V-Bucks</div>
                            <div class="item-price-rub">~ ${priceRub} ₽</div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                document.getElementById('shop-container').innerHTML = '<div class="empty-message">Ошибка загрузки</div>';
            }
        }

        function openModal(name, price, priceRub, image) {
            selectedItem = { name: name, price: price };
            
            document.getElementById('modal-img').src = image;
            document.getElementById('modal-name').innerText = name;
            document.getElementById('modal-price').innerText = `${price} V-Bucks (~${priceRub} ₽)`;
            
            document.getElementById('itemModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('itemModal').classList.remove('active');
            selectedItem = null;
        }

        function confirmPurchase() {
            if (!selectedItem) return;

            // Закрываем окно
            closeModal();

            // Показываем окошко с подтверждением и перенаправлением
            tg.showPopup({
                title: 'Переход в чат',
                message: `Вы выбрали "${selectedItem.name}". Сейчас откроется чат с продавцом для оформления покупки.`,
                buttons: [{type: 'ok', text: 'Перейти в чат'}, {type: 'cancel', text: 'Отмена'}]
            }, (buttonId) => {
                if (buttonId === 'ok') {
                    tg.openTelegramLink(`https://t.me/${TELEGRAM_CONTACT}`);
                }
            });
        }

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateTimer(); 
        }

        function updateTimer() {
            const now = new Date();
            let target = new Date();
            target.setHours(3, 0, 0, 0); 
            if (now > target) target.setDate(target.getDate() + 1);

            const diff = target - now;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('timer-text').innerText = 
                `${translations[currentLang].timerPrefix}${hours}ч ${minutes}м ${seconds}с`;
        }

        fetchFortniteSkins();
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
